services:
  postgres:
    image: postgres:16
    container_name: triply-postgres
    environment:
      POSTGRES_DB: triply
      POSTGRES_USER: triply
      POSTGRES_PASSWORD: triply2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: no

  app:
    build: .
    container_name: triply-app
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - postgres
    restart: no

volumes:
  postgres_data: