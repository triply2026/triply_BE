name: Deploy to EC2 (Docker)

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest # 성능 좋은 깃허브 서버에서 빌드합니다.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 여기서 자바 빌드를 미리 합니다 (서버가 힘들어하지 않게!)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile,docker-compose.yml"
          target: "/home/ec2-user/triply"
          strip_components: 2

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL, DB_USERNAME, DB_PASSWORD
          script: |
            cd /home/ec2-user/triply
            # 파일 이름 정리
            mv *.jar app.jar || true
            
            printf "DB_URL=%s\nDB_USERNAME=%s\nDB_PASSWORD=%s\n" "$DB_URL" "$DB_USERNAME" "$DB_PASSWORD" > .env
            
            sudo docker-compose up -d --build
            sudo docker image prune -f