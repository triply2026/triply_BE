name: Deploy to EC2

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user"
          strip_components: 2

      - name: Start application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user
            
            CURRENT_PID=$(pgrep -f "triply-0.0.1-SNAPSHOT.jar")
            if [ -z "$CURRENT_PID" ]; then
                echo "No running application found."
            else
                echo "Stopping application (PID: $CURRENT_PID)..."
                kill -15 $CURRENT_PID
                sleep 5
            fi

            if [ -f .env ]; then
                export $(grep -v '^#' .env | xargs)
            fi

            echo "Starting application..."
            nohup java -jar triply-0.0.1-SNAPSHOT.jar > app.log 2>&1 < /dev/null &
            
            sleep 3
            if ps -ef | grep -v grep | grep "triply-0.0.1-SNAPSHOT.jar" > /dev/null
            then
                echo "Application started successfully."
            else
                echo "Application failed to start. Check app.log"
                exit 1
            fi