name: Deploy to EC2 (Docker)

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy source to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/triply"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL, DB_USERNAME, DB_PASSWORD
          script: |
            cd /home/ec2-user/triply
            
            printf "DB_URL=%s\nDB_USERNAME=%s\nDB_PASSWORD=%s\n" "$DB_URL" "$DB_USERNAME" "$DB_PASSWORD" > .env
            
            sudo docker-compose up -d --build
            
            sudo docker image prune -f
            
            sleep 10
            sudo docker ps | grep triply-app

